# The relay runs as a Kamal accessory on the hblabs server: a stock image, with the
# static binary uploaded next to it, so there's nothing to build or push. No Kamal
# app is ever deployed here, and kamal-proxy and the other sites aren't touched.
# Deploy with `make deploy-relay`, not kamal directly: bin/relay-deploy builds the
# binary and loads the dashboard's password.
service: spppd
image: spppd-unused

servers:
  - 62.169.20.136

ssh:
  user: vanillaiice

registry:
  server: localhost:5555

# Kamal insists on these. Nothing is ever built.
builder:
  arch: amd64

accessories:
  relay:
    image: alpine:3.20
    host: 62.169.20.136
    cmd: /srv/relay -addr :8080 -dashboard :9090
    # UDP, open to the world, for the game. Docker keeps the sender's address, which
    # the rate limit and bans depend on.
    port: "8080:8080/udp"
    files:
      # z relabels it for SELinux, and does nothing on a server without it.
      - dist/relay-linux:/srv/relay:ro,z
    options:
      # The dashboard stays on the server's loopback. Reach it over SSH:
      # ssh -L 9090:127.0.0.1:9090 vanillaiice@62.169.20.136
      publish: "127.0.0.1:9090:9090"
      restart: unless-stopped
      # It faces the internet and needs nothing from the system.
      user: nobody
      read-only: true
      cap-drop: ALL
    env:
      secret:
        - SPPPD_DASHBOARD_TOKEN

aliases:
  relay-logs: accessory logs relay -f
